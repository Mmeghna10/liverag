name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: CDC decoder unit tests (no database needed)
        working-directory: services/cdc
        run: uvx pytest -q
      - name: Syntax errors and undefined names
        run: uvx ruff check --select E9,F63,F7,F82 services packages evals

  web:
    name: Web app lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build