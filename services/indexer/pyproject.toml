[project]
name = "liverag-indexer"
version = "0.1.0"
description = "LiveRAG indexer: chunk, embed and load source data into pgvector"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "liverag-core",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
]

# Install liverag-core from the repo folder, in editable mode: edits to it take effect at once.
[tool.uv.sources]
liverag-core = { path = "../../packages/liverag-core", editable = true }
