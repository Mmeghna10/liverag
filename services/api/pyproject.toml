[project]
name = "liverag-api"
version = "0.1.0"
description = "LiveRAG API: auth, chat, search, admin (index DB migrations live here)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "liverag-core",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
liverag-core = { path = "../../packages/liverag-core", editable = true }